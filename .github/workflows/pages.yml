name: Deploy personal site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [arcana-updated, phantom-air-raid-updated]

permissions:
  contents: read

concurrency:
  group: personal-site-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SITE_BASE_PATH: /miiyakumo
    steps:
      - name: Checkout personal site
        uses: actions/checkout@v6

      - name: Checkout Arcana
        uses: actions/checkout@v6
        with:
          repository: miiyakumo/arcana
          ref: main
          path: _arcana
          fetch-depth: 1
          token: ${{ secrets.MIIYAKUMO_SOURCE_TOKEN || github.token }}

      - name: Checkout Phantom Air Raid
        uses: actions/checkout@v6
        with:
          repository: miiyakumo/phantom-air-raid
          ref: main
          path: _phantom_air_raid
          fetch-depth: 1
          token: ${{ secrets.MIIYAKUMO_SOURCE_TOKEN || github.token }}

      - name: Setup Node for personal site
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Integrate Arcana into Pages artifact
        run: |
          mkdir -p dist/arcana
          cp _arcana/index.html _arcana/app.js _arcana/style.css dist/arcana/
          cp -R _arcana/assets dist/arcana/assets
          echo "Arcana bundled at /miiyakumo/arcana/"

      - name: Setup Node for Phantom Air Raid
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: _phantom_air_raid/package-lock.json

      - name: Build Phantom Air Raid
        working-directory: _phantom_air_raid
        run: |
          npm ci
          npm run build

      - name: Integrate Phantom Air Raid into Pages artifact
        run: |
          mkdir -p dist/phantom-air-raid
          cp -R _phantom_air_raid/dist/. dist/phantom-air-raid/
          echo "Phantom Air Raid bundled at /miiyakumo/phantom-air-raid/"
          du -sh dist dist/arcana dist/phantom-air-raid

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
